name: Daily QA Briefing - Run tests and email report

on:
  schedule:
    # These two UTC times map to 06:00 Australia/Sydney depending on DST
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  daily-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Check Sydney time
        run: |
          hour=$(TZ=Australia/Sydney date +"%H")
          echo "Sydney hour: $hour"
          if [ "$hour" != "06" ]; then
            echo "Not 06:00 in Sydney — exiting"
            exit 0
          fi

      - name: Run Playwright tests
        run: npx playwright test --reporter=html || true

      - name: Find report
        id: find_report
        run: |
          if [ -f test-results/reports/daily-briefing.html ]; then
            echo "report_path=test-results/reports/daily-briefing.html" >> $GITHUB_OUTPUT
          elif [ -f playwright-report/index.html ]; then
            echo "report_path=playwright-report/index.html" >> $GITHUB_OUTPUT
          else
            echo "report_path=" >> $GITHUB_OUTPUT
          fi

      - name: Upload report artifact
        if: steps.find_report.outputs.report_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: daily-briefing-report
          path: ${{ steps.find_report.outputs.report_path }}

      - name: Send email with report
        if: steps.find_report.outputs.report_path != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Daily QA Briefing"
          body: "Attached is the daily QA briefing report."
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          secure: true
          attachments: ${{ steps.find_report.outputs.report_path }}
