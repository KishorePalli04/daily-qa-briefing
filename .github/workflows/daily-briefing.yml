name: Daily QA Briefing

on:
  schedule:
    # Sydney 06:00 local time maps to 19:00 UTC (DST UTC+11) and 20:00 UTC (standard UTC+10).
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Run in debug mode (headed browser via xvfb)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  daily-briefing:
    name: Run Daily QA Briefing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install chromium --with-deps

      - name: Run API tests
        run: npx playwright test tests/api/ --reporter=list
        env:
          CI: true

      - name: Run UI tests
        run: npx playwright test tests/ui/ --reporter=list
        env:
          CI: true

      - name: Locate generated report
        id: find_report
        run: |
          REPORT=""
          if [ -f test-results/reports/daily-briefing.html ]; then
            REPORT=test-results/reports/daily-briefing.html
          else
            REPORT=$(find test-results -type f -name 'daily-briefing.html' 2>/dev/null | head -n1 || true)
          fi
          echo "report=$REPORT" >> $GITHUB_OUTPUT

      - name: Upload Daily Briefing Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-briefing-${{ github.run_number }}
          path: ${{ steps.find_report.outputs.report }}

      - name: Upload Test Artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: test-results/

      - name: Send email via Gmail SMTP
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Daily QA Intelligence Briefing - ${{ github.run_number }}"
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.EMAIL_TO }}
          body: |
            Hello,

            Attached is the Daily QA Intelligence Briefing generated by the Playwright test run.

            Regards,
            QA Automation
          attachments: ${{ steps.find_report.outputs.report }}
          secure: true
