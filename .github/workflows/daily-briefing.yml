name: Daily QA Briefing

on:
  schedule:
    # Sydney 06:00 local time maps to 19:00 UTC (DST UTC+11) and 20:00 UTC (standard UTC+10).
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  run-tests:
    name: Run API + UI tests and send report
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (with deps)
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --config=playwright.config.ts

      - name: Locate generated report
        id: find_report
        run: |
          REPORT=""
          if [ -f test-results/reports/daily-briefing.html ]; then
            REPORT=test-results/reports/daily-briefing.html
          else
            REPORT=$(find test-results -type f -name 'daily-briefing.html' 2>/dev/null | head -n1 || true)
          fi
          echo "report=$REPORT" >> $GITHUB_OUTPUT

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-briefing-report
          path: ${{ steps.find_report.outputs.report }}

      - name: Send email via Gmail SMTP
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Daily QA Intelligence Briefing - ${{ github.run_id }}"
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.EMAIL_TO }}
          body: |
            Hello,

            Attached is the Daily QA Intelligence Briefing generated by the Playwright test run.

            Regards,
            QA Automation
          attachments: ${{ steps.find_report.outputs.report }}
          secure: true
name: 🤖 Daily QA Briefing

# ── Triggers ────────────────────────────────────────────────
on:
  # Run every day at 9:00 PM UTC = 7:00 AM AEST (Sydney)
  schedule:
    - cron: '0 21 * * *'

  # Allow manual trigger from GitHub UI (great for testing)
  workflow_dispatch:
    inputs:
      debug:
        description: 'Run in debug mode (headed browser via xvfb)'
        required: false
        default: 'false'

# ── Permissions ─────────────────────────────────────────────
permissions:
  contents: read
  pages: write       # For optional GitHub Pages deployment
  id-token: write

# ── Jobs ────────────────────────────────────────────────────
jobs:
  daily-briefing:
    name: Run Daily QA Briefing
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Checkout code
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies
      - name: 📦 Install dependencies
        run: npm ci

      # 4. Install Playwright browsers (Chromium only for speed)
      - name: 🎭 Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # 5. Run API tests first
      - name: 🔌 Run API Tests (Hacker News)
        run: npx playwright test tests/api/ --reporter=list
        env:
          CI: true

      # 6. Run UI tests second (they merge data from API tests)
      - name: 🌐 Run UI Tests (GitHub Trending)
        run: npx playwright test tests/ui/ --reporter=list
        env:
          CI: true

      # 7. Upload the HTML briefing report as artifact
      - name: 📊 Upload Daily Briefing Report
        if: always()   # Upload even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: daily-briefing-${{ github.run_number }}
          path: |
            test-results/reports/daily-briefing.html
            playwright-report/
          retention-days: 30

      # 8. Upload test results (traces, screenshots, videos)
      - name: 📁 Upload Test Artifacts
        if: failure()  # Only upload on failure to save space
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: test-results/
          retention-days: 7

      # ── Optional: Deploy report to GitHub Pages ────────────
      # Uncomment below to publish the briefing as a website
      #
      # - name: 🚀 Deploy to GitHub Pages
      #   uses: actions/deploy-pages@v4
      #   with:
      #     artifact_name: daily-briefing-${{ github.run_number }}

      # ── Optional: Send email/Slack notification ────────────
